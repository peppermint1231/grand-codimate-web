<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#145d55" />
    <title>코디메이트 · 상담을 이어주는 공간</title>
    <link rel="stylesheet" href="/src/components/StartupLoading.css" />
  </head>
  <body style="margin: 0">
    <div id="root">
      <main
        class="codimate-startup"
        aria-busy="true"
        aria-label="코디메이트 시작 중"
      >
        <div class="startup-glow" aria-hidden="true"></div>
        <section class="startup-content" role="status">
          <div class="startup-mark" aria-hidden="true">
            <span>C</span><i></i><i></i>
          </div>
          <p class="startup-wordmark">CODIMATE</p>
          <h1>상담을 이어주는 공간</h1>
          <p class="startup-message">오늘의 상담을 준비하고 있어요</p>
          <div class="startup-dots" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
          <small>코디메이트</small>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
